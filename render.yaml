services:
  - type: web
    name: lembretes-whatsapp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: America/Sao_Paulo
      # sync: false = o Render pede o valor na tela na hora de criar
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # chave da criptografia dos dados pessoais (gere com: npm run gerar-chave). Sem ela o servidor não sobe.
      - key: CHAVE_DADOS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PRECO_MENSAL
        value: "9,90"
      - key: PRECO_ANUAL
        value: "79,90"
      - key: ASAAS_API_KEY        # chave de API do Asaas ($aact_hmlg_... no teste, $aact_prod_... valendo)
        sync: false
      - key: ASAAS_AMBIENTE       # sandbox ou producao
        value: sandbox
      - key: ASAAS_WEBHOOK_TOKEN  # o mesmo token configurado no webhook do Asaas
        sync: false
      - key: PREMIUM_LINK
        sync: false
      # quem responde pelo serviço (aparece nos Termos de uso e na Política de privacidade)
      - key: RESPONSAVEL_NOME
        sync: false
      - key: RESPONSAVEL_DOCUMENTO
        sync: false
      - key: CONTATO_EMAIL
        sync: false
      - key: CIDADE
        value: Toledo, PR
      # WhatsApp: baileys (chip + QR code, padrão) ou oficial (API da Meta, veja a seção 7 do README)
      - key: WHATSAPP_PROVEDOR
        value: baileys
