services:
  - type: web
    name: lembretes-whatsapp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: America/Sao_Paulo
      # sync: false = o Render pede o valor na tela na hora de criar
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PRECO_MENSAL
        value: "9,90"
      - key: PRECO_ANUAL
        value: "79,90"
      - key: PREMIUM_LINK
        sync: false
