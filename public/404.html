<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/marca/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/marca/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0FA055">
<script>
/* tema: escolha salva > configuração do aparelho (roda antes de desenhar a página, sem piscar) */
(function () {
  var salvo = null; try { salvo = localStorage.getItem('lembraai:tema'); } catch (e) {}
  var escuro = salvo ? salvo === 'escuro' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.tema = escuro ? 'escuro' : 'claro';
})();
</script>
<title>Página não encontrada — Lembra Aí</title>
<style>
  :root { --verde:#1f8f5f; --verde-escuro:#17734c; --verde-claro:#e7f5ee; --cinza:#6b7280; --texto:#111827; --card:#fff; --texto-2:#4b5563; --linha:#e5e7eb; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; overflow:hidden;
    font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:var(--texto);
    background:
      radial-gradient(800px 500px at 15% 0%, #d6efe3 0%, transparent 60%),
      radial-gradient(700px 500px at 100% 100%, #dfeaf7 0%, transparent 60%),
      #f6f7f9;
  }
  main { text-align:center; max-width:460px; position:relative; z-index:1; }

  /* 4 [sino] 4 */
  .numero { display:flex; align-items:center; justify-content:center; gap:6px; font-size:clamp(84px, 22vw, 140px); font-weight:800; line-height:1; letter-spacing:-.04em; color:var(--verde); }
  .numero .d { display:inline-block; animation:cai .7s cubic-bezier(.34,1.56,.64,1) both; }
  .numero .d:last-child { animation-delay:.18s; }
  @keyframes cai { from { opacity:0; transform:translateY(-60px) rotate(-8deg); } to { opacity:1; transform:none; } }

  .sino {
    width:clamp(84px, 20vw, 128px); height:clamp(84px, 20vw, 128px); border-radius:50%; background:var(--card);
    display:grid; place-items:center; box-shadow:0 14px 40px rgba(31,143,95,.18), inset 0 0 0 6px var(--verde-claro);
    animation:surge .6s .08s cubic-bezier(.34,1.56,.64,1) both; position:relative;
  }
  @keyframes surge { from { opacity:0; transform:scale(.3); } to { opacity:1; transform:none; } }
  .sino svg { width:52%; height:52%; color:var(--verde); transform-origin:50% 12%; animation:toca 2.4s 1s ease-in-out infinite; }
  @keyframes toca {
    0%, 55%, 100% { transform:rotate(0); }
    5% { transform:rotate(18deg); } 12% { transform:rotate(-16deg); } 19% { transform:rotate(12deg); }
    26% { transform:rotate(-9deg); } 33% { transform:rotate(5deg); } 40% { transform:rotate(-3deg); }
  }
  /* ondinhas quando o sino toca */
  .sino::before, .sino::after {
    content:''; position:absolute; inset:0; border-radius:50%; border:2px solid var(--verde); opacity:0;
    animation:onda 2.4s 1s ease-out infinite;
  }
  .sino::after { animation-delay:1.25s; }
  @keyframes onda { 0% { opacity:.5; transform:scale(1); } 45%, 100% { opacity:0; transform:scale(1.5); } }

  h1 { font-size:22px; margin:26px 0 8px; animation:sobe .5s .35s ease-out both; }
  p { margin:0 auto; color:var(--texto-2); font-size:15px; line-height:1.6; max-width:380px; animation:sobe .5s .45s ease-out both; }
  .acoes { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:26px; animation:sobe .5s .55s ease-out both; }
  @keyframes sobe { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  a.botao, button.botao {
    display:inline-flex; align-items:center; gap:8px; padding:12px 18px; border-radius:10px; font:inherit; font-size:15px; font-weight:500;
    text-decoration:none; cursor:pointer; border:0; transition:background .2s, transform .15s, box-shadow .2s;
  }
  .principal { background:var(--verde); color:#fff; box-shadow:0 6px 18px rgba(31,143,95,.25); }
  .principal:hover { background:var(--verde-escuro); transform:translateY(-1px); }
  .secundario { background:var(--card); color:var(--texto); border:1px solid var(--linha) !important; }
  .secundario:hover { transform:translateY(-1px); }
  .botao svg { width:18px; height:18px; }

  /* papeizinhos (lembretes perdidos) flutuando no fundo */
  .papel {
    position:fixed; width:46px; height:56px; background:var(--card); border-radius:8px; box-shadow:0 6px 18px rgba(17,24,39,.08);
    opacity:.75; animation:flutua 9s ease-in-out infinite; z-index:0;
  }
  .papel::before, .papel::after { content:''; position:absolute; left:9px; right:9px; height:4px; border-radius:4px; background:var(--linha); }
  .papel::before { top:16px; } .papel::after { top:26px; right:17px; }
  .p1 { top:12%; left:8%; transform:rotate(-12deg); }
  .p2 { top:70%; left:12%; animation-delay:-3s; width:38px; height:46px; }
  .p3 { top:18%; right:10%; animation-delay:-5s; }
  .p4 { bottom:10%; right:16%; animation-delay:-1.5s; width:34px; height:42px; }
  @keyframes flutua { 0%, 100% { translate:0 0; rotate:-8deg; } 50% { translate:0 -22px; rotate:6deg; } }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }

  /* ---------- modo escuro: comum ---------- */
  html[data-tema="escuro"] { color-scheme:dark; }
  html.tema-trocando, html.tema-trocando *, html.tema-trocando *::before, html.tema-trocando *::after {
    transition:background-color .35s ease, border-color .35s ease, color .35s ease, fill .35s ease, box-shadow .35s ease !important; }
  .so-escuro { display:none !important; }
  html[data-tema="escuro"] .so-claro { display:none !important; }
  html[data-tema="escuro"] .so-escuro { display:revert !important; }
  .btn-tema { width:36px; height:36px; flex:none; border-radius:50%; border:1px solid var(--borda, #e5e7eb); background:var(--card, #fff); color:var(--texto, #111827);
    display:grid; place-items:center; cursor:pointer; padding:0; transition:transform .2s; }
  .btn-tema:hover { transform:rotate(-12deg); }
  .btn-tema svg { width:18px; height:18px; grid-area:1/1; transition:transform .45s cubic-bezier(.34,1.56,.64,1), opacity .3s; }
  .btn-tema .sol { transform:rotate(-90deg) scale(.4); opacity:0; }
  html[data-tema="escuro"] .btn-tema .sol { transform:none; opacity:1; color:#fbbf24; }
  html[data-tema="escuro"] .btn-tema .lua { transform:rotate(90deg) scale(.4); opacity:0; }
  html[data-tema="escuro"] { --verde:#2fb37a; --verde-escuro:#26976a; --verde-claro:rgba(47,179,122,.18); --cinza:#94a3b8; --texto:#e6edf3; --card:#161d25; --texto-2:#c3cdd7; --linha:#2a3542; }
  html[data-tema="escuro"] body { background:radial-gradient(800px 500px at 15% 0%, rgba(47,179,122,.16) 0%, transparent 60%), radial-gradient(700px 500px at 100% 100%, rgba(56,120,200,.14) 0%, transparent 60%), #0e1318; }
  html[data-tema="escuro"] .papel { box-shadow:0 6px 18px rgba(0,0,0,.4); opacity:.5; }
</style>
</head>
<body>
  <div class="papel p1"></div><div class="papel p2"></div><div class="papel p3"></div><div class="papel p4"></div>
  <main>
    <div class="numero" aria-label="404">
      <span class="d">4</span>
      <span class="sino">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
        </svg>
      </span>
      <span class="d">4</span>
    </div>
    <h1>Essa página não existe</h1>
    <p>A gente lembra de tudo, menos desse endereço. Talvez o link esteja errado, ou a página tenha mudado de lugar.</p>
    <div class="acoes">
      <a class="botao principal" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>
        Ir pro início
      </a>
      <button class="botao secundario" type="button" onclick="history.length > 1 ? history.back() : location.assign('/')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
        Voltar
      </button>
    </div>
  </main>
<script>
/* botão de tema + acompanha o aparelho enquanto a pessoa não escolher */
(function () {
  var raiz = document.documentElement;
  function corBarra() { var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = raiz.dataset.tema === 'escuro' ? '#0e1318' : '#0FA055'; }
  function aplicar(t, salvar) {
    raiz.classList.add('tema-trocando');
    raiz.dataset.tema = t; corBarra();
    if (salvar) { try { localStorage.setItem('lembraai:tema', t); } catch (e) {} }
    clearTimeout(aplicar.t); aplicar.t = setTimeout(function () { raiz.classList.remove('tema-trocando'); }, 400);
  }
  document.querySelectorAll('[data-trocar-tema]').forEach(function (b) {
    b.addEventListener('click', function () { aplicar(raiz.dataset.tema === 'escuro' ? 'claro' : 'escuro', true); });
  });
  var mq = matchMedia('(prefers-color-scheme: dark)');
  var ouvir = function (e) { var salvo = null; try { salvo = localStorage.getItem('lembraai:tema'); } catch (x) {} if (!salvo) aplicar(e.matches ? 'escuro' : 'claro', false); };
  if (mq.addEventListener) mq.addEventListener('change', ouvir);
  corBarra();
})();
</script>
</body>
</html>
